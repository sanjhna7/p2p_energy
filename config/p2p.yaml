    url: "https://bydbatterybox.com/uploads/downloads/BBOX_LVS_Datasheet_EN_V1.0_240626_L-668f94bd814fd.pdf"
    sha256: "e786fba9c62eba445c5dfc5d3a97f5d9ccf09273dd71ae75501e5de44ecef512"
  byd_lvs_au_2023:
    citation: "BYD, Battery-Box Premium LVS datasheet, AU V2.2, 4 Jan 2023"
    url: "https://bydbatterybox.com/uploads/downloads/230318_BYD%20Battery-Box%20Premium%20LVS%20Datasheet_AU%20V2.2-64153555191fb.pdf"
    sha256: "c8af864c2b196c6ccdfb15dbf4b1f16e4adb4f1e689d185639a4d077853b5b9f"
  aer_dmo_2026_27:
    citation: "Australian Energy Regulator, Default market offer prices 2026-27: Final determination, May 2026, Figure 2.1"
    url: "https://www.aer.gov.au/system/files/2026-05/AER%20-%20Final%20determination%20-%20Default%20market%20offer%202026%E2%80%9327.pdf"
    sha256: "8c062224dbfc43e34ceae2486d671ee69c00daf0ab973bbefee8a94fd8903dd2"
  ipart_fit_2026_27:
    citation: "IPART, Fact Sheet: Solar feed-in tariff benchmark for 2026-27, 25 May 2026"
    url: "https://www.ipart.nsw.gov.au/sites/default/files/cm9_documents/Fact-Sheet-All-day-solar-feed-in-tariff-benchmark-tariff-2026-27.PDF"
    sha256: "08c16056822ccc40eeeeeb6958047c458a5277199b5de1ac2e09319076e51680"
  ieee_eulv_2015:
    citation: "IEEE PES Test Feeders WG, European LV Test Feeder (2015), Transformer.csv: TR1 11/0.416 kV, 0.8 MVA"
    url: "https://cmte.ieee.org/pes-testfeeders/wp-content/uploads/sites/167/2017/08/European_LV_Test_Feeder_v2.zip"
    sha256: "47fcb8188d958426cdeae225e3b82591c55a97e70e0e65dc6b7ce8e560446ddc"
  etsi_en_300_132_3:
    citation: "ETSI EN 300 132-3 V2.3.1 (2023-01), Power supply interface at the input to ICT equipment; Part 3: Up to 400 V DC, clauses 5.2-5.3"
    url: "https://www.etsi.org/deliver/etsi_en/300100_300199/30013203/02.03.01_60/en_30013203v020301p.pdf"
    sha256: "41138fef9b4e504c37bfe93e04e5c404605e3e7f5e111f6622154bdb1324ec0e"

data:
  # Output of `python -m data_pipeline.build`.
  processed_dir: "data/processed/mvp_ausgrid_eulv"

scenario:
  n_houses:
    value: 10
    source: SCENARIO
    note: "Houses taken from the smallest feeder branch holding this many; 55 = whole feeder."
  start:
    value: "2011-01-01"
    source: SCENARIO
    note: "Australian summer, when the 2010-11 homes have the most PV surplus."
  days:
    value: 14
    source: SCENARIO

battery:
  model: "BYD Battery-Box Premium LVS 4.0, one module per house"
  usable_energy_kwh:
    value: 4.0
    source: SPEC
    ref: byd_lvs_2024
    note: "DC usable energy at 100% DOD, 0.2C, 25 C. The whole window is usable, so SoC runs 0..1."
  nominal_voltage_v:
    value: 51.2
    source: SPEC
    ref: byd_lvs_2024
  operating_voltage_min_v:
    value: 40.0
    source: SPEC
    ref: byd_lvs_2024
  operating_voltage_max_v:
    value: 57.6
    source: SPEC
    ref: byd_lvs_2024
  max_continuous_current_a:
    value: 65.0
    source: SPEC
    ref: byd_lvs_2024
    note: "Max continuous output current, LVS 4.0."
  rated_dc_power_kw:
    value: 3.3
    source: SPEC
    ref: byd_lvs_au_2023
    note: "LVS 4.0 column. The sheet gives one rating, so it limits both charge and discharge."
  round_trip_efficiency:
    value: 0.95
    source: SPEC
    ref: byd_lvs_2024
    note: "Datasheet states >= 95%; the lower bound is used."
  initial_soc:
    value: 0.5
    source: SCENARIO

tariff:
  # Flat-rate retail tariff in the Ausgrid area. Prices are 2026-27, applied
  # to 2010-11 household profiles. The daily supply charge (166.2289 c/day)
  # is paid by every house whatever it trades, so it is left out.
  grid_buy_c_per_kwh:
    value: 33.1372
    source: SPEC
    ref: aer_dmo_2026_27
    note: "Ausgrid residential flat-rate DMO usage cap, incl. GST."
  feed_in_c_per_kwh:
    value: 4.95
    source: SCENARIO
    ref: ipart_fit_2026_27
    note: "Midpoint of IPART's all-day benchmark range 3.4-6.5 c/kWh (GST not stated)."

network:
  # DC abstraction of the IEEE European LV feeder: same topology and cable
  # resistance, two-wire DC (loop resistance = 2 x R1, see p2p/powerflow.py).
  # The grid-tie converter at the transformer holds the bus voltage.
  bus_voltage_v:
    value: 380.0
    source: PENDING
    ref: etsi_en_300_132_3
    note: "Placeholder: ETSI example normal operating voltage. Replace with the EEE community bus voltage."
  voltage_min_v:
    value: 260.0
    source: PENDING
    ref: etsi_en_300_132_3
    note: "Placeholder: ETSI normal service range minimum. Replace with the EEE limit."
  voltage_max_v:
    value: 400.0
    source: PENDING
    ref: etsi_en_300_132_3
    note: "Placeholder: ETSI normal service range maximum. Replace with the EEE limit."
  line_current_max_a:
    value: null
    source: PENDING
    note: "The IEEE feeder gives no cable ampacity. Currents are reported but not enforced until the EEE spec sets a limit."
  grid_tie_max_kw:
    value: 800.0
    source: PENDING
    ref: ieee_eulv_2015
    note: "Placeholder: the benchmark transformer's 0.8 MVA taken as kW. Replace with the EEE grid-tie converter rating."

reward:
  # reward_i = -cost_i - penalties_i. Every penalty is computed on the
  # PROPOSED action, before the safety layer blocks it, so agents learn not
  # to propose unsafe actions. Weights convert a violation into AUD so it is
  # comparable with the bill; they are tuning parameters, not facts.
  # Shared terms are given to every agent (the network is a common good).
  own_voltage_aud_per_v:
    value: 0.05
    source: SCENARIO
    note: "Own node: volts outside [voltage_min_v, voltage_max_v]."
  network_voltage_aud_per_v:
    value: 0.01
    source: SCENARIO
    note: "Shared: volts outside the band summed over every node."
  line_overload_aud_per_a:
    value: 0.01
    source: SCENARIO
    note: "Shared: amps above line_current_max_a summed over cables; inactive while that limit is null."
  grid_overload_aud_per_kw:
    value: 0.1
    source: SCENARIO
    note: "Shared: kW above grid_tie_max_kw in either direction."
  collapse_aud:
    value: 1.0
    source: SCENARIO
    note: "Shared: the proposed action's power flow does not converge."
  blocked_aud:
    value: 0.2
    source: SCENARIO
    note: "Shared: the safety layer replaced the proposed action."
  infeasible_aud_per_kwh:
    value: 0.01
    source: SCENARIO
    note: "Own: requested minus executed battery energy (above the rating, or more than the stored energy or headroom allows). Kept small: clipping is physically harmless."
