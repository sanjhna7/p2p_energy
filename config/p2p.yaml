# =====================================================================
# P2P energy configuration
# =====================================================================
#
# Every number carries a `source`:
#   REAL      measured data (the Ausgrid series themselves, not set here)
#   SPEC      manufacturer datasheet or standard; `ref` names an entry in
#             `references` below, and the loader rejects a SPEC without one
#   SCENARIO  an experiment choice of ours, not a fact about the world
#   PENDING   a placeholder until the EEE team's electrical specification
#             arrives; must carry a `note`, may cite a `ref` for the
#             placeholder, and `value: null` means "reported, not enforced"
#
# Values that come from the data (30-min interval, PV capacity, load and
# generation) are read from data/processed/ and never repeated here.
# =====================================================================

references:
  byd_lvs_2024:
